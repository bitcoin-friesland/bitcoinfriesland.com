name: Site quality
on:
  pull_request:
  push:
    branches: [main, feat/supporter-program]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node audit-site.cjs
      - run: node --test audit-site.test.cjs maintenance.test.cjs
      - run: node --check assets/main.js
